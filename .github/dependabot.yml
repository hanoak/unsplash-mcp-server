version: 2
updates:
  # Keep npm dependencies patched (security + freshness).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'
    groups:
      dev-dependencies:
        dependency-type: development

  # Keep the pinned GitHub Actions SHAs up to date.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
