version: 2
updates:
  # Keep npm dependencies patched (security + freshness).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development

  # Keep the pinned GitHub Actions SHAs up to date.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
